name: Python Testing & Linting

on:
  push:
    branches: [main, develop]
    paths:
      - '**.py'
      - 'airflow/**'
      - 'dataproc/**'
      - 'cloud_functions/**'
      - 'tests/**'
      - '.github/workflows/python-test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**.py'
      - 'airflow/**'
      - 'dataproc/**'
      - 'cloud_functions/**'
      - 'tests/**'

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint
      
      - name: Run Black formatter check
        run: |
          black --check --diff airflow/ dataproc/ cloud_functions/ tests/ 2>/dev/null || true
      
      - name: Run isort import check
        run: |
          isort --check-only --diff airflow/ dataproc/ cloud_functions/ tests/ 2>/dev/null || true
      
      - name: Run Flake8
        run: |
          flake8 airflow/ dataproc/ cloud_functions/ tests/ \
            --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
      
      - name: Run Pylint
        run: |
          pylint airflow/**/*.py dataproc/**/*.py cloud_functions/**/*.py tests/**/*.py \
            --disable=all --enable=F,E --fail-under=8 2>/dev/null || true
        continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install -r tests/requirements.txt 2>/dev/null || true
          pip install pytest pytest-cov pytest-mock
      
      - name: Run pytest
        run: |
          pytest tests/ -v --cov=airflow --cov=dataproc --cov=cloud_functions \
            --cov-report=term-missing --cov-report=html \
            --junitxml=test-results.xml 2>/dev/null || echo "Tests completed"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results.xml
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run Bandit security scan
        run: |
          bandit -r airflow/ dataproc/ cloud_functions/ -f json -o bandit-report.json 2>/dev/null || true
      
      - name: Run Safety check
        run: |
          safety check --json 2>/dev/null || true
        continue-on-error: true
