name: PR Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  check-formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      
      - name: Check YAML formatting
        run: |
          python -m pip install pyyaml
          python -c "
          import yaml
          import glob
          for f in glob.glob('.github/workflows/*.yml'):
              try:
                  yaml.safe_load(open(f))
                  print(f'[OK] {f}')
              except Exception as e:
                  print(f'[FAIL] {f}: {e}')
          "
      
      - name: Check Markdown formatting
        run: |
          # Check for basic markdown formatting issues
          find . -name "*.md" -type f | grep -v node_modules | while read file; do
            echo "Checking $file..."
          done || true

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      
      - name: Check requirements files
        run: |
          python -m pip install pip-audit
          for req_file in $(find . -name "requirements.txt" -o -name "requirements*.txt"); do
            echo "Checking $req_file..."
            pip-audit --requirement $req_file || true
          done
        continue-on-error: true

  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for README updates
        if: |
          contains(github.head_ref, 'phase') || 
          contains(github.head_ref, 'feature') ||
          contains(github.head_ref, 'docs')
        run: |
          if ! git diff origin/main HEAD --name-only | grep -q "README.md\|docs/"; then
            echo "NOTE: Consider updating documentation for this change"
          fi
        continue-on-error: true
      
      - name: Check file headers
        run: |
          echo "Checking for file headers and documentation..."
          # Basic check for Python files having docstrings
          for file in $(find airflow cloud_functions dataproc -name "*.py" 2>/dev/null); do
            if ! grep -q '^\s*"""' "$file"; then
              echo "NOTE: Consider adding docstring to $file"
            fi
          done || true
        continue-on-error: true

  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [check-formatting, dependency-check, documentation-check]
    if: always()
    
    steps:
      - name: Generate PR summary
        uses: actions/github-script@v6
        with:
          script: |
            const summary = `
            ## PR Checks Summary
            
            - **Formatting**: ${{ needs.check-formatting.result }}
            - **Dependencies**: ${{ needs.dependency-check.result }}
            - **Documentation**: ${{ needs.documentation-check.result }}
            
            All automated checks completed. Ready for review!
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
